[package]
name = "nemasvg"
version = "0.1.0"
description = "Asciinema -> Animated SVG Generator"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Quasiflo/nemasvg"
readme = "README.md"
keywords = ["asciinema", "asciicast", "svg", "terminal", "animation"]
categories = ["command-line-utilities", "multimedia"]
exclude = [".config/", ".vscode/", ".github/", "docs/", "scripts/", "AGENTS.md"]

[lib]
name = "nemasvg"
path = "src/lib.rs"

[[bin]]
name = "nemasvg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
avt = "0.18"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
fontcull = { version = "2.0", default-features = false }
read-fonts = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = "0.47"
ttf2woff2 = "0.13"
zstd = "0.14"
