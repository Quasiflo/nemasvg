[package]
name = "nemasvg"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Asciinema -> Animated SVG Generator"
readme = "README.md"
repository = "https://github.com/Quasiflo/nemasvg"
license = "Apache-2.0"
keywords = ["animation", "asciicast", "asciinema", "svg", "terminal"]
categories = ["command-line-utilities", "multimedia"]
exclude = [".config/", ".github/", ".vscode/", "AGENTS.md", "docs/", "scripts/"]

[lib]
name = "nemasvg"
path = "src/lib.rs"

[[bin]]
name = "nemasvg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
avt = "0.18"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
fontcull = { version = "2.0", default-features = false }
read-fonts = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = "0.47"
ttf2woff2 = "0.13"
zstd = "0.14"
